version: '3.8'

services:
  # Service 1: Redis Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Service 2: FastAPI Web API
  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  # Service 3: Celery Background Worker Process
  worker:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis